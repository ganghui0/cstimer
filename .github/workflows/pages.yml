name: Deploy to Github Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4.0.0
        with: 
          distribution: 'temurin'
          java-version: '11'
      - name: Setup php
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.0'
      - name: Build cstimer
        run: mkdir dist/local dist/local/js dist/local/css && make local
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/local'

  # A separate job: deploy-pages looks the artifact up by listing the run's artifacts, and that
  # list can still be empty a moment after the upload finishes (actions/deploy-pages#451).
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
